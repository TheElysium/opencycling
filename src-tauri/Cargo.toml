[package]
name = "opencycling"
version = "0.3.2"
description = "Free local-first indoor cycling training app: FTMS trainer control, .zwo workouts, session recording"
authors = ["Luka Signe--Morice"]
edition = "2021"
default-run = "opencycling"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "opencycling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
futures = "0.3.32"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
roxmltree = "0.21"
btleplug = "0.12.0"
uuid = { version = "1.23.1", features = ["v4"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
chrono = "0.4.44"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tauri-specta = { version = "2.0.0-rc", features = ["typescript"] }
specta-typescript = "0.0.12"
specta = "2.0.0-rc"

[package.metadata.release]
publish = false                                   # desktop app, not a crates.io crate
push = true
tag-name = "v{{version}}"
pre-release-commit-message = "chore: release v{{version}}"
tag-message = "Release v{{version}}"
# Cargo.toml is bumped automatically; propagate the same version to the JSON manifests.
pre-release-replacements = [
  { file = "../package.json", search = "\"version\": \"[^\"]+\"", replace = "\"version\": \"{{version}}\"", exactly = 1 },
  { file = "tauri.conf.json", search = "\"version\": \"[^\"]+\"", replace = "\"version\": \"{{version}}\"", exactly = 1 },
]
