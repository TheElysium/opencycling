[package]
name = "opencycling"
version = "0.1.0"
description = "A Tauri App"
authors = ["Luka Signe--Morice"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519pas
name = "opencycling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
futures = "0.3.32"
thiserror = "2.0.18"
log = "0.4.29"
env_logger = "0.11.10"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
opentelemetry = { version = "0.32.0", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32.0", features = ["trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-stdout = { version = "0.32.0", features = ["trace", "metrics", "logs"] }
tracing-opentelemetry = "0.32.1"

