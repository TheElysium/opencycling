<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OpenCycling — Structured ERG workouts. Your trainer, your data.">
  <style>
    .ff { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .h  { font-weight: 800; }
    .sb { font-weight: 700; }
    .sm { font-weight: 600; }
  </style>

  <defs>
    <linearGradient id="rampA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="rampB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#1e293b" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="420" fill="#f8f9fa"/>
  <rect x="0" y="0" width="1200" height="4" fill="#3b82f6"/>

  <!-- ============ LEFT: copy ============ -->
  <!-- logo mark -->
  <svg x="72" y="58" width="46" height="46" viewBox="0 0 100 100">
    <mask id="m0" maskUnits="userSpaceOnUse" x="25" y="7" width="25" height="93"><path d="M25 7.85H50V100H25V7.85Z" fill="#fff"/></mask>
    <g mask="url(#m0)"><path d="M0 34.9L12.5 22.9L28 25.2L51.5 7.5L70.5 11L84 0.1L100 6.4V100H0V34.9Z" fill="#4ADE80"/></g>
    <mask id="m1" maskUnits="userSpaceOnUse" x="0" y="22" width="25" height="78"><path d="M0 32.5C0 27 4.5 22.5 10 22.5H25V100H5C2.2 100 0 97.8 0 95V32.5Z" fill="#fff"/></mask>
    <g mask="url(#m1)"><path d="M0 34.9L12.5 22.9L28 25.2L51.5 7.5L70.5 11L84 0.1L100 6.4V100H0V34.9Z" fill="#60A5FA"/></g>
    <mask id="m2" maskUnits="userSpaceOnUse" x="75" y="0" width="25" height="100"><path d="M75 0H90C95.5 0 100 4.5 100 10V95C100 97.8 97.8 100 95 100H75L75 0Z" fill="#fff"/></mask>
    <g mask="url(#m2)"><path d="M0 34.9L12.5 22.9L28 25.2L51.5 7.5L70.5 11L84 0.1L100 6.4V100H0V34.9Z" fill="#F87171"/></g>
    <mask id="m3" maskUnits="userSpaceOnUse" x="50" y="3" width="25" height="97"><path d="M50 3.14H75V100H50V3.14Z" fill="#fff"/></mask>
    <g mask="url(#m3)"><path d="M0 34.9L12.5 22.9L28 25.2L51.5 7.5L70.5 11L84 0.1L100 6.4V100H0V34.9Z" fill="#FACC15"/></g>
    <path d="M52 40.5c2.2 0 4.4 1 5.8 2.7 1.5 1.7 3.7 2.7 6.1 2.7s4.6-1 6.1-2.7c1.5-1.7 2-3.7 1.7-5.9-.5-3.4-4.1-6.1-8.5-5.9-4.1.2-8 1.7-11 4.4l-1.7 1.7c-.5.5-.7 1.2-.2 1.9.2.7 1 1 1.7 1Z" fill="#1E293B"/>
    <path d="M53.7 68.6 44.6 63l11.2-9.7 4.6 4.6c.5.5 1 .7 1.7.7h12.2c1.5 0 2.4-1 2.4-2.4s-1-2.4-2.4-2.4H63.2L56.1 46.6c-3.4-3.4-8.8-3.6-12.4-.5L35.1 53.5c-1.5 1-2.2 2.9-2 4.9.3 2 1.3 3.7 3 4.9l13.7 8.5-4.4 12.9c-.5 1.2.2 2.7 1.4 3.2.2 0 .5.2.7.2 1 0 2-.7 2.2-1.7l4.9-14.6c.5-1.5 0-2.7-1-3.2Z" fill="#1E293B"/>
    <path d="M25.6 65.6C17.6 65.6 11 72.2 11 80.3s6.6 14.6 14.6 14.6 14.6-6.6 14.6-14.6-6.6-14.7-14.6-14.7Z" fill="#1E293B"/>
    <path d="M74.4 65.6c-8 0-14.6 6.6-14.6 14.7s6.6 14.6 14.6 14.6S89 88.3 89 80.3s-6.6-14.7-14.6-14.7Z" fill="#1E293B"/>
  </svg>
  <text x="130" y="89" class="ff h" font-size="22" letter-spacing="0.8" fill="#3b82f6">OPENCYCLING</text>

  <!-- pill -->
  <rect x="72" y="124" width="252" height="28" rx="14" fill="#3b82f6" fill-opacity="0.1"/>
  <text x="88" y="143" class="ff sb" font-size="12.5" letter-spacing="0.8" fill="#3b82f6">100% OFFLINE · OPEN-SOURCE</text>

  <!-- headline -->
  <text x="71" y="212" class="ff h" font-size="46" letter-spacing="-0.5" fill="#1a202c">Structured ERG workouts.</text>
  <text x="71" y="262" class="ff h" font-size="46" letter-spacing="-0.5" fill="#1a202c">Your trainer, your data.</text>

  <!-- subtitle -->
  <text x="72" y="305" class="ff" font-size="17.5" fill="#718096">Run Zwift .zwo workouts in ERG mode over Bluetooth — fully offline.</text>


  <!-- ============ RIGHT: workout card (mirrors the app) ============ -->
  <g filter="url(#cardShadow)">
    <rect x="724" y="82" width="404" height="256" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  </g>

  <!-- dark chart -->
  <rect x="748" y="106" width="356" height="130" rx="8" fill="#1e293b"/>
  <!-- zone bars (baseline y=224) -->
  <rect x="762" y="166" width="72" height="58" rx="2" fill="url(#rampA)"/>
  <rect x="840" y="140" width="34" height="84" rx="2" fill="#4ade80"/>
  <rect x="878" y="176" width="34" height="48" rx="2" fill="#94a3b8"/>
  <rect x="916" y="140" width="34" height="84" rx="2" fill="#4ade80"/>
  <rect x="954" y="176" width="34" height="48" rx="2" fill="#94a3b8"/>
  <rect x="992" y="124" width="16" height="100" rx="2" fill="#f87171"/>
  <rect x="1012" y="124" width="16" height="100" rx="2" fill="#f87171"/>
  <rect x="1034" y="170" width="58" height="54" rx="2" fill="url(#rampB)"/>

  <!-- badge -->
  <rect x="748" y="252" width="116" height="22" rx="11" fill="#22c55e" fill-opacity="0.14"/>
  <text x="760" y="267" class="ff sb" font-size="11" letter-spacing="0.4" fill="#16a34a">● SWEET SPOT</text>

  <!-- title + meta -->
  <text x="748" y="298" class="ff sb" font-size="16" fill="#1a202c">Phase 1 — Tempo S1 (3x10min)</text>
  <text x="748" y="320" class="ff" font-size="13.5" fill="#718096">1h 5m · 57 TSS · 0.72 IF</text>
</svg>
