# Read by scripts/gate.sh (CI calls it too), parsed with sed: one `key: command` per line.
stack: tauri

format: cd src-tauri && cargo fmt --all --check

lint: bash scripts/check_size.sh && cd src-tauri && cargo clippy --all-targets -- -D warnings && cd .. && pnpm lint

typecheck: pnpm check

test: cd src-tauri && cargo test && cd .. && pnpm test

build: cd src-tauri && cargo run --bin export_bindings && git diff --exit-code -- ../src/lib/bindings.ts

sast: cd src-tauri && cargo deny check && cd .. && pnpm audit --prod --audit-level high
